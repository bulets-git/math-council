services:
  db:
    image: postgres:16-alpine
    container_name: math_council_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mathcouncil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mathcouncil_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mathcouncil_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mathcouncil} -d${POSTGRES_DB:-mathcouncil_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: math_council_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: math_council_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mathcouncil}:${POSTGRES_PASSWORD:-mathcouncil_dev_secret}@db:5432/${POSTGRES_DB:-mathcouncil_db}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: math_council_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mathcouncil}:${POSTGRES_PASSWORD:-mathcouncil_dev_secret}@db:5432/${POSTGRES_DB:-mathcouncil_db}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services/api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      python -m app.worker

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: math_council_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
